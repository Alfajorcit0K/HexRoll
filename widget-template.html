<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Ruleta Perks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Rajdhani:wght@500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --neon: #C83CFF;
      --bg-slot: #26262e;
      --bg-viewport: #1c1b22;
      --text: #eeeef2;
      --text-dim: #8a8a96;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: fit-content;
    }

    .top-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      padding: 14px 0 22px;
    }

    .color-widget {
      position: relative;
    }

    .color-swatch-btn {
      width: 44px;
      height: 44px;
      border: 2px solid var(--neon);
      border-radius: 50%;
      background: var(--neon);
      cursor: pointer;
      box-shadow: 0 0 8px var(--neon);
    }

    .color-swatch-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .color-popup {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: #1c1b22;
      border: 2px solid var(--neon);
      border-radius: 10px;
      padding: 12px;
      z-index: 10;
      width: 180px;
    }

    .hue-slider {
      height: 20px;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
    }

    .hue-thumb {
      position: absolute;
      top: -3px;
      width: 14px;
      height: 26px;
      border-radius: 5px;
      background: #fff;
      border: 2px solid #222;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .idioma-toggle {
      display: flex;
      gap: 4px;
      background: var(--bg-slot);
      border: 2px solid var(--neon);
      border-radius: 8px;
      padding: 3px;
      box-shadow: 0 0 8px var(--neon);
    }

    .idioma-btn,
    .tipo-btn,
    .modo-btn {
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 12px;
      color: var(--text-dim);
      background: transparent;
      border: none;
      border-radius: 6px;
      padding: 7px 9px;
      cursor: pointer;
    }

    .idioma-btn.activo,
    .tipo-btn.activo,
    .modo-btn.activo {
      background: var(--neon);
      color: #161217;
    }

    .idioma-btn:focus-visible,
    .tipo-btn:focus-visible,
    .modo-btn:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .empty-warning {
      font-weight: 600;
      font-size: 15px;
      color: #ff9a9a;
      background: rgba(0, 0, 0, .55);
      border: 1px solid #ff9a9a;
      border-radius: 8px;
      padding: 8px 16px;
      margin: -8px 0 16px;
    }

    .reels-row {
      display: flex;
      gap: 18px;
      padding: 0 6px 10px;
    }

    .modo-stage {
      position: relative;
      width: 1058px;
      height: 390px;
    }

    .modo-stage .reels-row {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
    }

    .reel-column {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .reel-stack {
      position: relative;
      width: 248px;
      height: 248px;
      flex: none;
    }

    .reel-stack-rect {
      position: relative;
      width: 308px;
      height: 314px;
      flex: none;
    }

    .diamond-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 170px;
      height: 170px;
      transform: translate(-50%, -50%) rotate(45deg);
      background: var(--bg-slot);
      border: 2px solid var(--neon);
      animation: neonPulse 2.6s ease-in-out infinite;
      z-index: 1;
    }

    .rect-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300px;
      height: 306px;
      transform: translate(-50%, -50%);
      background: var(--bg-slot);
      border: 2px solid var(--neon);
      border-radius: 12px;
      animation: neonPulse 2.6s ease-in-out infinite;
      z-index: 1;
    }

    .reel-viewport {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 170px;
      height: 170px;
      transform: translate(-50%, -50%);
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
      overflow: hidden;
      z-index: 2;
    }

    .rect-viewport {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 296px;
      height: 302px;
      transform: translate(-50%, -50%);
      overflow: hidden;
      border-radius: 10px;
      z-index: 2;
    }

    .reel-track {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
    }

    .card {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-viewport);
    }

    .card-diamond {
      width: 170px;
      height: 170px;
    }

    .card-rect {
      width: 296px;
      height: 302px;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-empty {
      color: #4a4a55;
      font-size: 34px;
      font-weight: 700;
    }

    .card-idle {
      background: transparent;
    }

    .name-plate {
      width: 220px;
      min-height: 54px;
      background: var(--bg-slot);
      border: 2px solid var(--neon);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 8px;
      text-align: center;
      animation: neonPulse 2.6s ease-in-out infinite;
    }

    .name-plate .es {
      font-weight: 700;
      font-size: 17px;
      color: var(--text);
      line-height: 1.15;
    }

    .name-plate .en {
      font-weight: 500;
      font-size: 12px;
      color: var(--text-dim);
      letter-spacing: .4px;
    }

    .reel-column.locked .diamond-frame,
    .reel-column.locked .rect-frame,
    .reel-column.locked .name-plate {
      animation: none;
      box-shadow: 0 0 22px var(--neon), 0 0 8px var(--neon) inset;
    }

    .reel-column.flash .diamond-frame,
    .reel-column.flash .rect-frame,
    .reel-column.flash .name-plate {
      box-shadow: 0 0 34px var(--neon), 0 0 14px var(--neon) inset;
    }

    @keyframes neonPulse {

      0%,
      100% {
        box-shadow: 0 0 6px var(--neon), 0 0 2px var(--neon) inset;
      }

      50% {
        box-shadow: 0 0 14px var(--neon), 0 0 4px var(--neon) inset;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .diamond-frame,
      .rect-frame,
      .name-plate {
        animation: none;
      }

      .reel-track {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="top-controls">
    <div class="color-widget">
      <button id="colorToggle" class="color-swatch-btn" title="Color neón"></button>
      <div id="colorPopup" class="color-popup" hidden>
        <div id="hueSlider" class="hue-slider">
          <div id="hueThumb" class="hue-thumb"></div>
        </div>
      </div>
    </div>
    <div class="idioma-toggle" title="Idioma de las perks">
      <button class="idioma-btn" data-idioma="es">ES-MX</button>
      <button class="idioma-btn" data-idioma="es-es">ES-ES</button>
      <button class="idioma-btn" data-idioma="en">EN</button>
    </div>
    <div class="idioma-toggle" id="tipoToggle" title="Tipo de perks">
      <button class="tipo-btn" data-tipo="survivor">SURV</button>
      <button class="tipo-btn" data-tipo="killer">KILLER</button>
    </div>
    <div class="idioma-toggle" title="Modo de ruleta">
      <button class="modo-btn" data-modo="perks">PERKS</button>
      <button class="modo-btn" data-modo="asesino">KILLER</button>
    </div>
  </div>


  <div id="empty-warning" class="empty-warning" hidden>Agrega al menos 4 habilidades activas desde el editor</div>

  <div id="empty-warning-asesino" class="empty-warning" hidden>Agrega al menos 1 asesino activo desde el editor</div>

  <div class="modo-stage">
    <div class="reels-row" id="reels">
      <div class="reel-column" data-i="0">
        <div class="reel-stack">
          <div class="diamond-frame"></div>
          <div class="reel-viewport">
            <div class="reel-track" id="track-0"></div>
          </div>
        </div>
        <div class="name-plate" id="name-0"><span class="es">&mdash;</span><span class="en"></span></div>
      </div>
      <div class="reel-column" data-i="1">
        <div class="reel-stack">
          <div class="diamond-frame"></div>
          <div class="reel-viewport">
            <div class="reel-track" id="track-1"></div>
          </div>
        </div>
        <div class="name-plate" id="name-1"><span class="es">&mdash;</span><span class="en"></span></div>
      </div>
      <div class="reel-column" data-i="2">
        <div class="reel-stack">
          <div class="diamond-frame"></div>
          <div class="reel-viewport">
            <div class="reel-track" id="track-2"></div>
          </div>
        </div>
        <div class="name-plate" id="name-2"><span class="es">&mdash;</span><span class="en"></span></div>
      </div>
      <div class="reel-column" data-i="3">
        <div class="reel-stack">
          <div class="diamond-frame"></div>
          <div class="reel-viewport">
            <div class="reel-track" id="track-3"></div>
          </div>
        </div>
        <div class="name-plate" id="name-3"><span class="es">&mdash;</span><span class="en"></span></div>
      </div>
    </div>

    <div class="reels-row" id="reel-asesino" hidden>
      <div class="reel-column" data-i="asesino">
        <div class="reel-stack-rect">
          <div class="rect-frame"></div>
          <div class="rect-viewport">
            <div class="reel-track" id="track-asesino"></div>
          </div>
        </div>
        <div class="name-plate" id="name-asesino"><span class="es">&mdash;</span><span class="en"></span></div>
      </div>
    </div>
  </div>

  <script>
    const HABILIDADES = /*START_HABILIDADES*/[]/*END_HABILIDADES*/;
    const ASESINOS = /*START_ASESINOS*/[]/*END_ASESINOS*/;

    const CARD_H = 170;
    const CARD_H_ASESINO = 302;
    const REEL_COUNT = 4;
    const LOOPS = 3;
    const BASE_DURATION = 1200;
    const DURATION_VARIANCE = 900; // rango de duración extra aleatoria por rodillo

    let spinning = false;

    const warningEl = document.getElementById('empty-warning');
    const warningAsesinoEl = document.getElementById('empty-warning-asesino');
    const tracks = [0, 1, 2, 3].map(i => document.getElementById('track-' + i));
    const namePlates = [0, 1, 2, 3].map(i => document.getElementById('name-' + i));
    const columns = [0, 1, 2, 3].map(i => document.querySelector('.reel-column[data-i="' + i + '"]'));

    const reelsPerks = document.getElementById('reels');
    const tipoToggle = document.getElementById('tipoToggle');
    const reelAsesino = document.getElementById('reel-asesino');
    const trackAsesino = document.getElementById('track-asesino');
    const namePlateAsesino = document.getElementById('name-asesino');
    const columnAsesino = document.querySelector('.reel-column[data-i="asesino"]');
    let lastAsesino = null;
    const colorToggle = document.getElementById('colorToggle');
    const colorPopup = document.getElementById('colorPopup');
    const hueSlider = document.getElementById('hueSlider');
    const hueThumb = document.getElementById('hueThumb');
    const idiomaBtns = Array.from(document.querySelectorAll('.idioma-btn'));

    function hueFromColorValue(v) {
      const m = /hsl\((\d+)/.exec(v || '');
      if (m) return parseInt(m[1], 10);
      return 280;
    }
    function applyColor(hue) {
      const color = 'hsl(' + Math.round(hue) + ',90%,55%)';
      document.documentElement.style.setProperty('--neon', color);
      localStorage.setItem('perks_color', color);
      colorToggle.style.background = color;
      hueThumb.style.left = (hue / 360 * 100) + '%';
    }
    applyColor(hueFromColorValue(localStorage.getItem('perks_color')));

    colorToggle.addEventListener('click', () => { colorPopup.hidden = !colorPopup.hidden; });
    let arrastrandoHue = false;
    function hueDesdeEvento(e) {
      const rect = hueSlider.getBoundingClientRect();
      const x = Math.min(Math.max(e.clientX - rect.left, 0), rect.width);
      return (x / rect.width) * 360;
    }
    hueSlider.addEventListener('mousedown', e => { arrastrandoHue = true; applyColor(hueDesdeEvento(e)); });
    window.addEventListener('mousemove', e => { if (arrastrandoHue) applyColor(hueDesdeEvento(e)); });
    window.addEventListener('mouseup', () => arrastrandoHue = false);
    hueSlider.addEventListener('touchstart', e => { applyColor(hueDesdeEvento(e.touches[0])); });
    hueSlider.addEventListener('touchmove', e => { applyColor(hueDesdeEvento(e.touches[0])); });


    let currentIdioma = localStorage.getItem('perks_idioma') || 'es';
    const lastTargets = [null, null, null, null];

    function displayName(item, idioma) {
      if (item.esVacio) {
        return idioma === 'en' ? 'Empty slot' : 'Slot vacío';
      }
      if (idioma === 'en') return item.nombre_en || '';
      if (idioma === 'es-es') return item.nombre_es_es || item.nombre_es || '';
      return item.nombre_es || '';
    }

    function mostrarNombreEnPlaca(np, target, idioma) {
      if (!target) { np.querySelector('.es').textContent = '—'; np.querySelector('.en').textContent = ''; return; }
      np.querySelector('.es').textContent = displayName(target, idioma);
      np.querySelector('.en').textContent = '';
    }

    function updateNamePlate(i) {
      mostrarNombreEnPlaca(namePlates[i], lastTargets[i], currentIdioma);
    }

    function marcarIdiomaActivo() {
      idiomaBtns.forEach(b => b.classList.toggle('activo', b.dataset.idioma === currentIdioma));
    }
    idiomaBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        currentIdioma = btn.dataset.idioma;
        localStorage.setItem('perks_idioma', currentIdioma);
        marcarIdiomaActivo();
        columns.forEach((c, i) => updateNamePlate(i));
        mostrarNombreEnPlaca(namePlateAsesino, lastAsesino, currentIdioma);
      });
    });
    marcarIdiomaActivo();

    let currentTipo = localStorage.getItem('perks_tipo') || 'survivor';
    const tipoBtns = Array.from(document.querySelectorAll('.tipo-btn'));
    function marcarTipoActivo() {
      tipoBtns.forEach(b => b.classList.toggle('activo', b.dataset.tipo === currentTipo));
    }
    tipoBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        currentTipo = btn.dataset.tipo;
        localStorage.setItem('perks_tipo', currentTipo);
        marcarTipoActivo();
        renderIdle();
      });
    });
    marcarTipoActivo();

    let currentModo = localStorage.getItem('perks_modo') || 'perks';
    const modoBtns = Array.from(document.querySelectorAll('.modo-btn'));
    function aplicarModo() {
      modoBtns.forEach(b => b.classList.toggle('activo', b.dataset.modo === currentModo));
      reelsPerks.style.display = currentModo === 'perks' ? 'flex' : 'none';
      reelAsesino.style.display = currentModo === 'asesino' ? 'flex' : 'none';
      tipoToggle.style.display = currentModo === 'perks' ? 'flex' : 'none';
      warningEl.hidden = currentModo !== 'perks' || activePool().length >= REEL_COUNT;
      warningAsesinoEl.hidden = currentModo !== 'asesino' || activeAsesinos().length >= 1;
    }
    modoBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        currentModo = btn.dataset.modo;
        localStorage.setItem('perks_modo', currentModo);
        aplicarModo();
        girarModoActual();
      });
    });
    aplicarModo();


    function activePool() { return HABILIDADES.filter(h => h.activo !== false && (h.esVacio || h.tipo === currentTipo)); }

    function renderIdle() {
      tracks.forEach(track => {
        track.style.transition = 'none';
        track.style.transform = 'translateY(0px)';
        track.innerHTML = '<div class="card card-diamond card-idle"></div>';
      });
      for (let i = 0; i < REEL_COUNT; i++) { lastTargets[i] = null; }
      namePlates.forEach(np => { np.querySelector('.es').textContent = '—'; np.querySelector('.en').textContent = ''; });
      columns.forEach(c => c.classList.remove('locked', 'flash'));

      trackAsesino.style.transition = 'none';
      trackAsesino.style.transform = 'translateY(0px)';
      trackAsesino.innerHTML = '<div class="card card-rect card-idle"></div>';
      lastAsesino = null;
      namePlateAsesino.querySelector('.es').textContent = '—';
      namePlateAsesino.querySelector('.en').textContent = '';
      columnAsesino.classList.remove('locked', 'flash');

      aplicarModo();
    }

    function cardHTML(item, claseTamano, carpeta) {
      claseTamano = claseTamano || 'card-diamond';
      carpeta = carpeta || 'perks';
      if (item.esVacio) return '<div class="card ' + claseTamano + ' card-empty">—</div>';
      const img = item.imagen ? '<img src="imagenes/' + carpeta + '/' + item.imagen + '" onerror="this.style.display=\'none\'">' : '';
      return '<div class="card ' + claseTamano + '">' + img + '</div>';
    }

    function pickUniqueTargets(pool, n) {
      const shuffled = pool.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled.slice(0, n);
    }

    const MAX_FILLER_CARDS = 24; // tope de cartas de relleno por giro; el resultado ya esta decidido antes de armar la tira, esto es puramente visual

    function buildStrip(pool, target, direction) {
      const seq = [];
      const totalCards = Math.min(pool.length * LOOPS, MAX_FILLER_CARDS) + 1;
      for (let i = 0; i < totalCards - 1; i++) seq.push(pool[Math.floor(Math.random() * pool.length)]);
      if (direction === 'down') { seq.unshift(target); }
      else { seq.push(target); }
      return seq;
    }

    function easeOutExpo(t) { return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t); }

    function spinReel(trackEl, columnEl, alTerminar, pool, target, duration, direction, cardH, claseTamano, carpeta) {
      return new Promise(resolve => {
        const strip = buildStrip(pool, target, direction);
        const totalDistance = (strip.length - 1) * cardH;

        const startPos = direction === 'down' ? -totalDistance : 0;
        const endPos = direction === 'down' ? 0 : -totalDistance;

        trackEl.style.transition = 'none';
        trackEl.style.transform = 'translateY(' + startPos + 'px)';
        trackEl.innerHTML = strip.map(item => cardHTML(item, claseTamano, carpeta)).join('');

        const start = performance.now();

        function frame(now) {
          const t = Math.min(1, (now - start) / duration);
          const pos = startPos + (endPos - startPos) * easeOutExpo(t);
          trackEl.style.transform = 'translateY(' + pos + 'px)';
          if (t < 1) { requestAnimationFrame(frame); }
          else {
            trackEl.style.transform = 'translateY(' + endPos + 'px)';
            alTerminar(target);
            columnEl.classList.add('locked', 'flash');
            setTimeout(() => columnEl.classList.remove('flash'), 350);
            resolve();
          }
        }
        requestAnimationFrame(frame);
      });
    }

    async function girar() {
      if (spinning || currentModo !== 'perks') return;
      const pool = activePool();
      if (pool.length < REEL_COUNT) return;

      spinning = true;
      columns.forEach(c => c.classList.remove('locked'));
      for (let i = 0; i < REEL_COUNT; i++) { lastTargets[i] = null; }
      namePlates.forEach(np => { np.querySelector('.es').textContent = '—'; np.querySelector('.en').textContent = ''; });

      const targets = pickUniqueTargets(pool, REEL_COUNT);
      await Promise.all(targets.map((t, i) => {
        const direction = Math.random() < 0.5 ? 'up' : 'down';
        const duration = BASE_DURATION + Math.random() * DURATION_VARIANCE;
        return spinReel(tracks[i], columns[i], (target) => { lastTargets[i] = target; updateNamePlate(i); }, pool, t, duration, direction, CARD_H, 'card-diamond', 'perks');
      }));

      spinning = false;
    }

    function activeAsesinos() { return ASESINOS.filter(a => a.activo !== false); }

    async function girarAsesino() {
      if (spinning || currentModo !== 'asesino') return;
      const pool = activeAsesinos();
      if (pool.length < 1) return;

      spinning = true;
      columnAsesino.classList.remove('locked');
      lastAsesino = null;
      mostrarNombreEnPlaca(namePlateAsesino, null, currentIdioma);

      const target = pool[Math.floor(Math.random() * pool.length)];
      const direction = Math.random() < 0.5 ? 'up' : 'down';
      const duration = BASE_DURATION + Math.random() * DURATION_VARIANCE;
      await spinReel(trackAsesino, columnAsesino, (t) => { lastAsesino = t; mostrarNombreEnPlaca(namePlateAsesino, t, currentIdioma); }, pool, target, duration, direction, CARD_H_ASESINO, 'card-rect', 'killers');

      spinning = false;
    }

    function girarModoActual() {
      if (currentModo === 'asesino') girarAsesino(); else girar();
    }

    window.addEventListener('obsSourceVisibleChanged', (e) => {
      if (e.detail && e.detail.visible) girarModoActual();
    });
    if (window.obsstudio) { // compatibilidad con versiones viejas de OBS (metodo legado)
      window.obsstudio.onVisibilityChange = (visible) => { if (visible) girarModoActual(); };
    }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') girarModoActual();
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); girarModoActual(); }
    });

    renderIdle();
    if (document.visibilityState === 'visible') girarModoActual();
  </script>
</body>

</html>
